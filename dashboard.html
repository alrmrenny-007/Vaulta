<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard | Vaulta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="bank.css">
</head>
<body>
<div class="blobs"><i></i><i></i><i></i></div>
<div class="app-shell">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main" id="view"><div class="empty" style="padding-top:90px">Loading your account...</div></main>
</div>
<nav class="bottom-nav" id="bottomNav"></nav>

<script src="app.js"></script>
<script src="bank.js"></script>
<script>
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = Bank.fmt;

let me = null, lastFetch = 0, showSeq = 0, loadError = '';
// Re-reads the account from the server. Returns false if that failed (401 sends you to log in).
async function refresh() {
  const r = await Bank.load();
  if (!r.ok) {
    if (r.status === 401) { location.replace('login.html'); return false; }
    loadError = r.msg; return false;
  }
  me = r.me; lastFetch = Date.now(); loadError = '';
  return true;
}

let lastShown = null;
let route = 'home', hideBal = false, tTab = 'send', hFilter = 'all', hQuery = '';

const NAV = [
  ['home', '🏠', 'Home'], ['transfer', '💸', 'Send'], ['cards', '💳', 'Cards'],
  ['history', '🧾', 'History'], ['settings', '⚙️', 'Settings']
];

/* ---------- helpers ---------- */
function toast(msg, type = 'ok') {
  $$('.toast').forEach(t => t.remove());
  const t = document.createElement('div');
  t.className = 'toast ' + type; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3500);
}
function closeModal() { $$('.overlay').forEach(o => o.remove()); }
function modal(html, dismissable = true) {
  closeModal();
  const o = document.createElement('div');
  o.className = 'overlay';
  o.innerHTML = '<div class="modal">' + html + '</div>';
  if (dismissable) o.addEventListener('click', e => { if (e.target === o) closeModal(); });
  document.body.appendChild(o);
  return o.firstChild;
}
function promptModal(html, mount) {
  return new Promise(res => {
    const m = modal(html, false);
    const done = v => { closeModal(); res(v); };
    $$('[data-cancel]', m).forEach(b => b.onclick = () => done(null));
    m.parentElement.addEventListener('click', e => { if (e.target === m.parentElement) done(null); });
    mount(m, done);
  });
}
const digitsOnly = el => el.addEventListener('input', () => { el.value = el.value.replace(/\D/g, ''); });

function askPin(title) {
  if (!me.hasPin) return createPin();
  return promptModal(
    `<h3>${esc(title || 'Enter transaction PIN')}</h3>
     <input class="input pin-input" id="pinIn" type="password" inputmode="numeric" maxlength="4" placeholder="••••" autocomplete="off">
     <div class="modal-actions"><button class="btn" data-cancel>Cancel</button><button class="btn btn-primary" id="pinOk">Confirm</button></div>`,
    (m, done) => {
      const inp = $('#pinIn', m); digitsOnly(inp);
      const go = () => inp.value.length === 4 ? done(inp.value) : toast('Enter your 4-digit PIN', 'err');
      $('#pinOk', m).onclick = go;
      inp.addEventListener('keydown', e => e.key === 'Enter' && go());
      setTimeout(() => inp.focus(), 50);
    });
}
function createPin() {
  return promptModal(
    `<h3>Create your transaction PIN</h3>
     <p class="muted small" style="margin-bottom:14px">You'll use this 4-digit PIN to confirm transfers, bill payments and card actions.</p>
     <div class="field"><label>New PIN</label><input class="input pin-input" id="p1" type="password" inputmode="numeric" maxlength="4" autocomplete="off"></div>
     <div class="field"><label>Confirm PIN</label><input class="input pin-input" id="p2" type="password" inputmode="numeric" maxlength="4" autocomplete="off"></div>
     <div class="modal-actions"><button class="btn" data-cancel>Cancel</button><button class="btn btn-primary" id="pinSave">Save PIN</button></div>`,
    (m, done) => {
      $$('input', m).forEach(digitsOnly);
      $('#pinSave', m).onclick = async () => {
        const a = $('#p1', m).value, b = $('#p2', m).value;
        if (a !== b) return toast('PINs do not match', 'err');
        const r = await Bank.setPin(me.id, a, '');
        if (!r.ok) return toast(r.msg, 'err');
        await refresh(); toast('PIN saved'); done(a);
      };
    });
}
function confirmModal(title, rows, btn = 'Continue') {
  return promptModal(
    `<h3>${esc(title)}</h3>${rows.map(([k, v]) => `<div class="stat"><span>${esc(k)}</span><b>${esc(v)}</b></div>`).join('')}
     <div class="modal-actions"><button class="btn" data-cancel>Cancel</button><button class="btn btn-primary" id="cOk">${esc(btn)}</button></div>`,
    (m, done) => { $('#cOk', m).onclick = () => done(true); });
}
function fieldModal(title, label, placeholder, btn, opts = {}) {
  return promptModal(
    `<h3>${esc(title)}</h3><div class="field"><label>${esc(label)}</label><input class="input" id="fIn" ${opts.numeric ? 'inputmode="decimal"' : ''} placeholder="${esc(placeholder)}" value="${esc(opts.value || '')}"></div>
     <div class="modal-actions"><button class="btn" data-cancel>Cancel</button><button class="btn btn-primary" id="fOk">${esc(btn)}</button></div>`,
    (m, done) => {
      const i = $('#fIn', m);
      if (opts.numeric) i.addEventListener('input', () => { i.value = i.value.replace(/[^\d.]/g, ''); });
      $('#fOk', m).onclick = () => done(i.value);
      i.addEventListener('keydown', e => e.key === 'Enter' && done(i.value));
      setTimeout(() => i.focus(), 50);
    });
}

const txIcon = t => ({ transfer: t.type === 'credit' ? '⬇️' : '⬆️', bill: '📄', deposit: '➕', fee: '🏷️' }[t.category] || '•');
const txTitle = t => t.category === 'transfer' ? (t.type === 'credit' ? 'From ' : 'To ') + t.counterparty.name
  : t.category === 'bill' ? 'Bill · ' + t.counterparty.name
  : t.category === 'deposit' ? (t.narration || 'Deposit') : t.narration;
const dt = ms => new Date(ms).toLocaleString('en-US', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });

function txRow(t) {
  const cr = t.type === 'credit';
  return `<div class="tx" data-act="receipt" data-id="${esc(t.id)}">
    <div class="tx-ic">${txIcon(t)}</div>
    <div class="tx-mid"><b>${esc(txTitle(t))}</b><span class="muted small">${dt(t.date)}</span></div>
    <div class="tx-amt ${cr ? 'cr' : 'dr'}">${cr ? '+' : '-'}${fmt(t.amount)}</div></div>`;
}
function receipt(t) {
  const cr = t.type === 'credit';
  modal(`<div class="receipt-top"><div class="tick"><svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path class="tick-path" d="M5 13l4 4L19 7"/></svg></div><div class="big">${cr ? '+' : '-'}${fmt(t.amount)}</div><div class="muted">${esc(t.status)}</div></div>
    <div class="stat"><span>${cr ? 'From' : 'To'}</span><b>${esc(t.counterparty.name)}</b></div>
    ${t.counterparty.acct && t.category === 'transfer' ? `<div class="stat"><span>Account</span><b>${esc(t.counterparty.acct)}</b></div>` : ''}
    <div class="stat"><span>Type</span><b>${esc(t.category)}</b></div>
    <div class="stat"><span>Narration</span><b>${esc(t.narration || '-')}</b></div>
    <div class="stat"><span>Date</span><b>${dt(t.date)}</b></div>
    <div class="stat"><span>Reference</span><b>${esc(t.id)}</b></div>
    <div class="stat"><span>Balance after</span><b>${fmt(t.balanceAfter)}</b></div>
    <div class="modal-actions"><button class="btn" data-act="copyRef" data-id="${esc(t.id)}">Copy ref</button><button class="btn btn-primary" data-act="closeModal">Done</button></div>`);
}

/* ---------- views ---------- */
function viewHome() {
  const rec = me.transactions.slice(0, 5);
  const live = me.cards.filter(c => c.status !== 'cancelled');
  return `<h1 class="page-title">Hi, ${esc(me.name.split(' ')[0])} <span class="wave">👋</span></h1>
  <div class="bank-card" data-tilt style="background:${THEMES[me.theme] || THEMES.emerald}">
    <div><div class="label">${esc(me.nickname)}</div><div class="label">Available balance</div></div>
    <div class="bal-big" id="balBig">${hideBal ? '$ ••••••' : fmt(me.balance)}</div>
    <div class="card-foot">
      <div><div class="label">Checking · Routing ${Bank.ROUTING}</div><div class="num-sm">${esc(me.accountNumber)}</div></div>
      <div class="row-btns"><button class="btn btn-sm glass" data-act="toggleBal">${hideBal ? 'Show' : 'Hide'}</button><button class="btn btn-sm glass" data-act="copyAcct">Copy</button></div>
    </div>
  </div>
  <div class="quick">
    <button data-go="transfer"><span class="ic">💸</span>Send money</button>
    <button data-act="addMoney"><span class="ic">➕</span>Add money</button>
    <button data-act="billGo"><span class="ic">📄</span>Pay bills</button>
    <button data-go="cardreq"><span class="ic">💳</span>Get a card</button>
  </div>
  ${live.length ? '' : `<div class="panel" style="margin-bottom:18px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
    <div><b>Request your debit card</b><div class="muted small">Cards start at $15. Delivery in 5-15 business days.</div></div><button class="btn btn-primary btn-sm" data-go="cardreq">Request card</button></div>`}
  <div class="panel"><div class="panel-head"><h3>Recent activity</h3><button class="link-btn" data-go="history">See all</button></div>
    ${rec.length ? rec.map(txRow).join('') : '<div class="empty">No transactions yet. Use Add money to get started.</div>'}</div>`;
}

function viewTransfer() {
  const used = Bank.spentToday(me);
  const head = `<h1 class="page-title">Send money</h1>
    <div class="seg"><button data-act="tab" data-v="send" class="${tTab === 'send' ? 'on' : ''}">Send money</button><button data-act="tab" data-v="bills" class="${tTab === 'bills' ? 'on' : ''}">Pay bills</button></div>`;
  const limit = `<div class="limit-note">Balance ${fmt(me.balance)} · Daily limit ${fmt(Bank.DAILY_LIMIT)} (used today ${fmt(used)})</div>`;
  if (tTab === 'bills') return head + `<form class="panel" id="billForm">${limit}
    <div class="field"><label>Bill type</label><select class="input" id="aCat">${Bank.BILL_CATEGORIES.map(c => `<option>${esc(c)}</option>`).join('')}</select></div>
    <div class="field"><label>Payee</label><input class="input" id="aPayee" maxlength="40" placeholder="e.g. City Power & Light"></div>
    <div class="field"><label>Account number on your bill</label><input class="input" id="aRef" maxlength="30" placeholder="Account or reference number"></div>
    <div class="field"><label>Amount ($)</label><input class="input" id="aAmt" inputmode="decimal" placeholder="0.00"></div>
    <button class="btn btn-primary btn-block">Pay bill</button></form>`;
  return head + `<form class="panel" id="sendForm">${limit}
    ${me.beneficiaries.length ? `<label class="lbl">Saved beneficiaries</label><div class="bene-row">${me.beneficiaries.map(b => `<button type="button" class="chip" data-act="pickBene" data-acct="${esc(b.acct)}">${esc(b.name.split(' ')[0])} · ${esc(b.acct.slice(-4))}</button>`).join('')}</div>` : ''}
    <div class="field"><label>Recipient account number</label><input class="input" id="sAcct" inputmode="numeric" maxlength="12" placeholder="Account number"><div class="hint" id="sHint"></div></div>
    <div class="field"><label>Amount ($)</label><input class="input" id="sAmt" inputmode="decimal" placeholder="0.00"></div>
    <div class="field"><label>Narration (optional)</label><input class="input" id="sNote" maxlength="60" placeholder="What's it for?"></div>
    <label class="chk"><input type="checkbox" id="sSave"> Save as beneficiary</label>
    <button class="btn btn-primary btn-block">Continue</button></form>`;
}

function trackHtml(c) {
  if (c.kind !== 'physical') return '';
  const idx = Bank.STAGES.indexOf(c.status), at = {};
  (c.events || []).forEach(e => { at[e.stage] = e.at; });
  const eta = c.etaMin ? [c.etaMin, c.etaMax] : null;
  const sp = Bank.SHIPPING[c.shipSpeed] ? Bank.SHIPPING[c.shipSpeed].label : 'Standard delivery';
  return (c.orderNo ? `<div class="order-line"><span>Order <b>${esc(c.orderNo)}</b></span><span class="muted small">Placed ${Bank.fmtDay(c.requestedAt)}</span></div>` : '') +
    '<div class="track">' + Bank.STAGES.map((s, i) => `<div class="step ${i <= idx ? 'done' : ''}"><i></i>${Bank.STAGE_LABEL[s]}<small>${at[s] ? Bank.fmtDay(at[s]) : '&nbsp;'}</small></div>`).join('') + '</div>' +
    (c.status !== 'active' && eta ? `<p class="muted small">Estimated delivery <b>${Bank.fmtDay(eta[0])} – ${Bank.fmtDay(eta[1])}</b> · ${esc(sp)}${c.delivery ? ' · ' + esc(c.delivery.city) + ', ' + esc(c.delivery.state) : ''}</p>` : '');
}
function cardFace(o) {
  return `<div class="vcard" ${o.tilt === false ? '' : 'data-tilt'} style="background:${o.bg}">
    <div class="vc-top"><b>Vaulta</b><span class="badge">${esc(o.badge)}</span></div>
    <div class="vc-chip"></div>
    <div class="vc-num">${o.number}</div>
    <div class="vc-bot"><div><small>CARD HOLDER</small><span class="wz-name">${esc(o.name)}</span></div><div><small>EXPIRES</small>${esc(o.expiry)}</div></div>
    ${o.overlay || ''}</div>`;
}
function cardVisual(c) {
  const t = Bank.TIERS[c.tier], d = Bank.DESIGNS[c.design];
  const pending = c.kind === 'physical' && c.status !== 'active';
  return cardFace({ bg: d ? d.bg : t.bg, badge: t.label.toUpperCase(), number: c.number.slice(0, 4) + ' •••• •••• ' + c.number.slice(-4), name: c.nameOnCard, expiry: c.expiry,
    overlay: c.frozen ? '<div class="vc-ov">❄ Frozen</div>' : pending ? `<div class="vc-ov soft">${esc(Bank.STAGE_LABEL[c.status])}</div>` : '' });
}
function cardBlock(c) {
  const t = Bank.TIERS[c.tier];
  let acts = '';
  if (c.status === 'active') acts = `<button class="btn btn-sm" data-act="reveal" data-id="${c.id}">Show details</button>
    <button class="btn btn-sm" data-act="freeze" data-id="${c.id}">${c.frozen ? 'Unfreeze' : 'Freeze'}</button>
    <button class="btn btn-sm" data-act="limit" data-id="${c.id}">Spend limit</button>
    <button class="btn btn-sm btn-danger" data-act="cancelCard" data-id="${c.id}">Cancel card</button>`;
  else if (c.status === 'delivered') acts = `<button class="btn btn-sm btn-primary" data-act="activate" data-id="${c.id}">Activate card</button>`;
  else acts = `<button class="btn btn-sm" data-act="advance" data-id="${c.id}">Next delivery stage</button>
    <button class="btn btn-sm btn-danger" data-act="cancelCard" data-id="${c.id}">Cancel request</button>`;
  return `<div class="card-block">${cardVisual(c)}<div>
    <h3>${esc(t.label)} ${c.kind === 'virtual' ? '' : c.kind + ' '}card</h3>
    <p class="muted small" style="margin:4px 0 12px">Ending ${c.number.slice(-4)} · ${c.limit ? 'Daily spend limit ' + fmt(c.limit) : 'No custom spend limit'}</p>
    ${trackHtml(c)}<div class="card-actions">${acts}</div></div></div>`;
}
function viewCards() {
  const cards = me.cards.filter(c => c.status !== 'cancelled');
  return `<div class="panel-head"><h1 class="page-title" style="margin:0">Your cards</h1><button class="btn btn-primary btn-sm" data-go="cardreq">+ Request card</button></div>
    <div class="panel">${cards.length ? cards.map(cardBlock).join('') : '<div class="empty">You have no cards yet.<br><br><button class="btn btn-primary" data-go="cardreq">Request your debit card</button></div>'}</div>
    `;
}
/* ---------- card order wizard ---------- */
let wz = null;
const WZ_STEPS = ['Card', 'Design', 'Delivery', 'Review'];
const wzNew = () => ({ step: 1, tier: 'standard', design: 'midnight', name: me.name.toUpperCase().replace(/[^A-Z .'-]/g, '').slice(0, 22), address: '', apt: '', city: '', state: '', zip: '', phone: me.phone, speed: 'standard', placed: null, busy: false });
const wzTotal = () => Bank.TIERS[wz.tier].fee + Bank.SHIPPING[wz.speed].fee;
const wzRange = (tier, speed) => { const [a, b] = Bank.eta(tier, speed); return Bank.fmtDay(a) + ' – ' + Bank.fmtDay(b); };
const wzExpiry = () => { const d = new Date(); d.setFullYear(d.getFullYear() + 4); return String(d.getMonth() + 1).padStart(2, '0') + '/' + String(d.getFullYear()).slice(-2); };

function wzPreview() {
  const t = Bank.TIERS[wz.tier], sh = Bank.SHIPPING[wz.speed];
  return cardFace({ bg: Bank.DESIGNS[wz.design].bg, badge: t.label.toUpperCase(), number: '9999 •••• •••• ••••', name: wz.name || 'YOUR NAME', expiry: wzExpiry() }) +
    `<div class="wz-sum"><div class="stat"><span>${esc(t.label)} card</span><b>${fmt(t.fee)}</b></div>
      <div class="stat"><span>${esc(sh.label)}</span><b>${sh.fee ? fmt(sh.fee) : 'Free'}</b></div>
      <div class="stat total"><span>Total</span><b>${fmt(wzTotal())}</b></div></div>`;
}
function wzStepHtml() {
  const s = wz.step;
  if (s === 1) return `<h2 class="wz-h">Choose your card</h2><div class="tier-grid">${Object.entries(Bank.TIERS).map(([k, x]) => {
    const [a, b] = Bank.ETA_DAYS[k].standard;
    return `<label class="tier"><input type="radio" name="tier" value="${k}" ${k === wz.tier ? 'checked' : ''}><div class="tier-in"><div class="mini" style="background:${Bank.DESIGNS[Bank.DESIGNS_BY_TIER[k][0]].bg}"></div><b>${esc(x.label)}</b><small><b>${fmt(x.fee)}</b> one-time fee</small><small class="muted">${esc(x.note)}</small><small class="muted">Delivery in ${a}-${b} business days</small></div></label>`;
  }).join('')}</div>`;
  if (s === 2) return `<h2 class="wz-h">Make it yours</h2>
    <label class="lbl">Design</label>
    <div class="swatches">${Bank.DESIGNS_BY_TIER[wz.tier].map(d => `<label class="sw"><input type="radio" name="design" value="${d}" ${d === wz.design ? 'checked' : ''}><i style="background:${Bank.DESIGNS[d].bg}"></i><span>${esc(Bank.DESIGNS[d].label)}</span></label>`).join('')}</div>
    <div class="field"><label for="cName">Name on card</label><input class="input" id="cName" maxlength="22" autocomplete="cc-name" value="${esc(wz.name)}"><small class="muted">3 to 22 letters. Spaces, . ' and - are allowed.</small></div>`;
  if (s === 3) return `<h2 class="wz-h">Where should we send it?</h2>
    <div class="field"><label for="cAddr">Street address</label><input class="input" id="cAddr" placeholder="123 Main St" autocomplete="address-line1" value="${esc(wz.address)}"></div>
    <div class="field"><label for="cApt">Apt / Suite (optional)</label><input class="input" id="cApt" autocomplete="address-line2" value="${esc(wz.apt)}"></div>
    <div class="row"><div class="field"><label for="cCity">City</label><input class="input" id="cCity" autocomplete="address-level2" value="${esc(wz.city)}"></div>
    <div class="field"><label for="cState">State</label><select class="input" id="cState"><option value="">Select</option>${Bank.STATES.map(x => `<option ${x === wz.state ? 'selected' : ''}>${x}</option>`).join('')}</select></div></div>
    <div class="row"><div class="field"><label for="cZip">ZIP code</label><input class="input" id="cZip" inputmode="numeric" maxlength="5" placeholder="10001" autocomplete="postal-code" value="${esc(wz.zip)}"></div>
    <div class="field"><label for="cPhone">Phone</label><input class="input" id="cPhone" inputmode="tel" autocomplete="tel" value="${esc(wz.phone)}"></div></div>
    <label class="lbl">Delivery speed</label>
    <div class="speeds">${Object.entries(Bank.SHIPPING).map(([k, x]) => `<label class="speed"><input type="radio" name="speed" value="${k}" ${k === wz.speed ? 'checked' : ''}><div class="speed-in"><div><b>${esc(x.label)}</b><small class="muted">Arrives ${wzRange(wz.tier, k)}</small></div><b>${x.fee ? '+' + fmt(x.fee) : 'Free'}</b></div></label>`).join('')}</div>`;
  const t = Bank.TIERS[wz.tier], sh = Bank.SHIPPING[wz.speed], total = wzTotal();
  return `<h2 class="wz-h">Review your order</h2>
    <div class="summary">
      <div class="stat"><span>Card</span><b>${esc(t.label)}</b></div>
      <div class="stat"><span>Design</span><b>${esc(Bank.DESIGNS[wz.design].label)}</b></div>
      <div class="stat"><span>Name on card</span><b>${esc(wz.name)}</b></div>
      <div class="stat"><span>Deliver to</span><b>${esc(wz.address)}${wz.apt ? ', ' + esc(wz.apt) : ''}, ${esc(wz.city)}, ${esc(wz.state)} ${esc(wz.zip)}</b></div>
      <div class="stat"><span>Delivery</span><b>${esc(sh.label)} · ${wzRange(wz.tier, wz.speed)}</b></div>
      <div class="stat"><span>Card fee</span><b>${fmt(t.fee)}</b></div>
      <div class="stat"><span>Shipping</span><b>${sh.fee ? fmt(sh.fee) : 'Free'}</b></div>
      <div class="stat total"><span>Total</span><b>${fmt(total)}</b></div>
      <div class="stat"><span>Balance after order</span><b>${fmt(me.balance - total)}</b></div>
    </div>
    ${me.balance < total ? '<p class="warn">Your balance is too low for this order. Add money first, then come back.</p>' : '<p class="muted small" style="margin-top:10px">You will confirm with your PIN. The total is taken from your account when you place the order.</p>'}`;
}
function wzDone() {
  const c = wz.placed, t = Bank.TIERS[c.tier], d = Bank.DESIGNS[c.design];
  return `<div class="panel wz-done">
    <div class="ok-ring">✓</div>
    <h1 class="page-title" style="margin:10px 0 4px">Order placed</h1>
    <p class="muted">We will email you when it ships. Keep your order number handy.</p>
    <div class="order-no" id="orderNo">${esc(c.orderNo)}</div>
    <div class="wz-done-card">${cardFace({ bg: d.bg, badge: t.label.toUpperCase(), number: c.number.slice(0, 4) + ' •••• •••• ' + c.number.slice(-4), name: c.nameOnCard, expiry: c.expiry })}</div>

/* ---------- wiring per view ---------- */
let stTheme;
const wire = {
  transfer() {
    const f = $('#sendForm'), a = $('#billForm');
    if (a) {
      $('#aAmt').addEventListener('input', e => e.target.value = e.target.value.replace(/[^\d.]/g, ''));
      a.onsubmit = async e => {
        e.preventDefault();
        const cat = $('#aCat').value, payee = $('#aPayee').value.trim(), ref = $('#aRef').value.trim(), amt = Bank.toKobo($('#aAmt').value);
        if (payee.length < 2) return toast('Enter the payee name', 'err');
        if (ref.length < 4) return toast('Enter the account number from your bill', 'err');
        if (!(amt >= 100)) return toast('Minimum payment is $1.00', 'err');
        if (amt > me.balance) return toast('Insufficient balance', 'err');
        const idem = Bank.newKey();
        if (!await confirmModal('Confirm bill payment', [['Type', cat], ['Payee', payee], ['Account', ref], ['Amount', fmt(amt)]], 'Pay')) return;
        const pin = await askPin(); if (!pin) return;
        const r = await Bank.billPay(me.id, cat, payee, ref, amt, pin, idem);
        if (!r.ok) return toast(r.msg, 'err');
        await refresh(); receipt(r.tx); show('transfer');
      };
      return;
    }
    const acct = $('#sAcct'), hint = $('#sHint');
    digitsOnly(acct);
    $('#sAmt').addEventListener('input', e => e.target.value = e.target.value.replace(/[^\d.]/g, ''));
    let lookupSeq = 0, found = null, timer = null;
    const setHint = (txt, cls) => { hint.textContent = txt; hint.className = 'hint ' + cls; };
    const check = async () => {
      const n = acct.value, my = ++lookupSeq; found = null;
      if (n.length < 8) { setHint('', ''); return null; }
      setHint('Checking...', '');
      const r = await Bank.lookup(n);
      if (my !== lookupSeq) return null;                 // a newer keystroke replaced this lookup
      if (!r.ok) { setHint(r.msg, 'err'); return null; }
      found = { name: r.name, acct: r.acct };
      setHint('✓ ' + r.name, 'ok');
      return found;
    };
    acct.addEventListener('input', () => { clearTimeout(timer); found = null; timer = setTimeout(check, 250); });
    f.onsubmit = async e => {
      e.preventDefault();
      const rec = found || await check(), amt = Bank.toKobo($('#sAmt').value), note = $('#sNote').value.trim();
      if (!rec) return toast('Enter a valid recipient account number', 'err');
      if (!(amt >= 100)) return toast('Minimum transfer is $1.00', 'err');
      if (amt > me.balance) return toast('Insufficient balance', 'err');
      const idem = Bank.newKey();                         // a retry of this same confirmation can never pay twice
      if (!await confirmModal('Confirm transfer', [['To', rec.name], ['Account', rec.acct], ['Amount', fmt(amt)], ['Narration', note || '-']], 'Send')) return;
      const pin = await askPin(); if (!pin) return;
      const r = await Bank.transfer(me.id, rec.acct, amt, note, pin, idem);
      if (!r.ok) return toast(r.msg, 'err');
      if ($('#sSave').checked) await Bank.addBeneficiary(me.id, rec);
      await refresh(); receipt(r.tx); show('transfer');
    };
  },
  cardreq() {
    if (wz.placed) {
      const no = $('#orderNo'); if (no) no.onclick = () => { navigator.clipboard && navigator.clipboard.writeText(wz.placed.orderNo).then(() => toast('Order number copied')).catch(() => {}); };
      return;
    }
    const go = n => { wz.step = n; show('cardreq'); window.scrollTo(0, 0); };
    const redrawPreview = () => { $('#wzPreview').innerHTML = wzPreview(); FX.tilt($('#wzPreview')); };
    const val = id => { const el = $(id); return el ? el.value : ''; };
    const read = () => {
      if (wz.step === 2) wz.name = val('#cName').toUpperCase();
      if (wz.step === 3) Object.assign(wz, { address: val('#cAddr').trim(), apt: val('#cApt').trim(), city: val('#cCity').trim(), state: val('#cState'), zip: val('#cZip'), phone: val('#cPhone') });
    };
    $$('input[name=tier]').forEach(r => r.addEventListener('change', () => { wz.tier = r.value; wz.design = Bank.DESIGNS_BY_TIER[wz.tier][0]; redrawPreview(); }));
    $$('input[name=design]').forEach(r => r.addEventListener('change', () => { wz.design = r.value; redrawPreview(); }));
    $$('input[name=speed]').forEach(r => r.addEventListener('change', () => { wz.speed = r.value; redrawPreview(); }));
    const nm = $('#cName');
    if (nm) nm.addEventListener('input', () => { wz.name = nm.value.toUpperCase(); const el = $('#wzPreview .wz-name'); if (el) el.textContent = wz.name || 'YOUR NAME'; });
    if ($('#cPhone')) { digitsOnly($('#cZip')); }
    const clearBad = () => { const e = $('#wzErr'); if (e) e.style.display = 'none'; };
    const bad = m => { const e = $('#wzErr'); e.textContent = m; e.style.display = 'block'; e.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); };
    $('#wzForm').addEventListener('input', clearBad); $('#wzForm').addEventListener('change', clearBad);
    const bk = $('#wzBack'); if (bk) bk.onclick = () => { read(); go(wz.step - 1); };
    $('#wzForm').onsubmit = async e => {
      e.preventDefault(); read(); clearBad();
      if (wz.step === 2 && !/^[A-Z][A-Z .'-]{2,21}$/.test(wz.name.trim())) return bad('Name on card must be 3 to 22 letters.');
      if (wz.step === 3) {
        if (wz.address.length < 5) return bad('Enter your street address.');
        if (wz.city.length < 2) return bad('Enter your city.');
        if (!wz.state) return bad('Choose your state.');
        if (!/^\d{5}$/.test(wz.zip)) return bad('Enter a 5-digit ZIP code.');
        const pd = wz.phone.replace(/\D/g, ''); if (pd.length < 10 || pd.length > 15) return bad('Enter a valid phone number.');
      }
      if (wz.step < 4) return go(wz.step + 1);
      const total = wzTotal();
      if (total > me.balance) return bad(`Insufficient balance. This order totals ${fmt(total)}. Add money first.`);
      if (wz.busy) return;
      const pin = await askPin(); if (!pin) return;
      wz.busy = true; const btn = $('#wzNext'); if (btn) { btn.disabled = true; btn.textContent = 'Placing order...'; }
      const o = { tier: wz.tier, design: wz.design, speed: wz.speed, nameOnCard: wz.name.trim(), address: wz.address, apt: wz.apt, city: wz.city, state: wz.state, zip: wz.zip, phone: wz.phone };
      const r = await Bank.requestCard(me.id, o, pin);
      wz.busy = false;
      if (!r.ok) { if (btn) { btn.disabled = false; btn.textContent = 'Place order · ' + fmt(total); } return bad(r.msg); }
      wz.placed = r.card; await refresh(); show('cardreq'); window.scrollTo(0, 0);
    };
  },
  history() {
    drawHist();
    $('#hSearch').addEventListener('input', e => { hQuery = e.target.value; drawHist(true); });
  },
  settings() {
    digitsOnly($('#stAcct'));
    $$('#pinForm input').forEach(digitsOnly);
    stTheme = me.theme;
    const draw = () => {
      $('#stThemes').innerHTML = '';
      Object.entries(THEMES).forEach(([k, bg]) => {
        const d = document.createElement('div'); d.className = 'theme-dot' + (k === stTheme ? ' active' : '');
        d.style.background = bg; d.onclick = () => { stTheme = k; draw(); }; $('#stThemes').appendChild(d);
      });
    };
    draw();
    let ck = 0, tm = null;
    $('#stAcct').addEventListener('input', e => {
      clearTimeout(tm); const val = e.target.value, my = ++ck;
      tm = setTimeout(async () => {
        const r = await Account.check(val); const h = $('#stHint');
        if (my !== ck || !h) return;
        h.textContent = r.msg; h.className = 'hint ' + (r.ok ? 'ok' : 'err');
      }, 250);
    });
    $('#profForm').onsubmit = async e => {
      e.preventDefault();
      const name = $('#stName').value.trim(), phone = $('#stPhone').value.trim();
      if (name.length < 2) return toast('Enter your name', 'err');
      if (phone.replace(/\D/g, '').length < 10) return toast('Enter a valid phone number', 'err');
      const r = await API.patch('/me/profile', { name, phone });
      if (!r.ok) return toast(r.msg, 'err');
      await refresh(); toast('Profile saved'); show('settings');
    };
    $('#acctForm').onsubmit = async e => {
      e.preventDefault();
      const n = $('#stAcct').value, body = { accountNumber: n, nickname: $('#stNick').value.trim() || 'Main Account', theme: stTheme };
      if (n === me.accountNumber) delete body.accountNumber;
      else {
        const lc = Account.localCheck(n); if (!lc.ok) return toast(lc.msg, 'err');
        const pin = await askPin('Confirm with your PIN'); if (!pin) return;
        body.pin = pin;                                   // the server verifies the PIN
      }
      const r = await API.patch('/me/account', body);
      if (!r.ok) return toast(r.msg, 'err');
      await refresh(); toast('Account updated'); show('settings');
    };
    $('#pinForm').onsubmit = async e => {
      e.preventDefault();
      const a = $('#pnNew').value, b = $('#pnNew2').value;
      if (a !== b) return toast('PINs do not match', 'err');
      const r = await Bank.setPin(me.id, a, me.hasPin ? $('#pnCur').value : '');
      if (!r.ok) return toast(r.msg, 'err');
      await refresh(); toast('PIN updated'); show('settings');
    };
    $('#pwForm').onsubmit = async e => {
      e.preventDefault();
      const r = await Bank.changePassword(me.id, $('#pwCur').value, $('#pwNew').value);
      if (!r.ok) return toast(r.msg, 'err');
      $('#pwCur').value = ''; $('#pwNew').value = ''; toast('Password updated');
    };
  }
};

/* ---------- actions ---------- */
const byId = id => me.transactions.find(t => t.id === id);
const acts = {
  closeModal,
  toggleBal() { hideBal = !hideBal; show('home'); },
  async copyDD() {
    const t = `Routing: ${Bank.ROUTING}\nAccount: ${me.accountNumber}\nType: Checking`;
    try { await navigator.clipboard.writeText(t); toast('Details copied'); } catch { toast('Routing ' + Bank.ROUTING); }
  },
  async copyAcct() { try { await navigator.clipboard.writeText(me.accountNumber); toast('Account number copied'); } catch { toast(me.accountNumber); } },
  async copyRef(el) { try { await navigator.clipboard.writeText(el.dataset.id); toast('Reference copied'); } catch { toast(el.dataset.id); } },
  receipt(el) { const t = byId(el.dataset.id); if (t) receipt(t); },
  tab(el) { tTab = el.dataset.v; show('transfer'); },
  pickBene(el) { const i = $('#sAcct'); i.value = el.dataset.acct; i.dispatchEvent(new Event('input')); $('#sAmt').focus(); },
  billGo() { tTab = 'bills'; show('transfer'); },
  filter(el) { hFilter = el.dataset.v; show('history'); },
  csv() {
    const p = new URLSearchParams();
    if (hFilter !== 'all') p.set('filter', hFilter);
    if (hQuery) p.set('q', hQuery);
    const a = document.createElement('a');
    a.href = '/api/transactions/export' + (p.toString() ? '?' + p : '');      // the server builds the statement
    a.download = ''; document.body.appendChild(a); a.click(); a.remove();
  },
  async older() {
    const last = me.transactions[me.transactions.length - 1]; if (!last) return;
    const r = await API.get('/transactions?limit=200&before=' + last.seq);
    if (!r.ok) return toast(r.msg, 'err');
    me.transactions = me.transactions.concat(r.transactions); me.hasMoreTx = r.hasMore;
    lastFetch = Date.now(); show('history');
  },
  print() { window.print(); },
  async logout() { await API.post('/auth/logout'); location.href = 'login.html'; },
  async addMoney() {
    const k = await promptModal(
      `<h3>Add money</h3>
       ${Object.entries(ADD_METHODS).map(([key, m]) => `<button class="method" data-m="${key}"><span class="ic">${m.icon}</span><span><b>${esc(m.title)}</b><small>${esc(m.sub)}</small></span></button>`).join('')}
       <div class="modal-actions"><button class="btn" data-cancel>Cancel</button></div>`,
      (m, done) => { $$('.method', m).forEach(b => b.onclick = () => done(b.dataset.m)); });
    if (!k) return;
    if (k === 'dd') return directDeposit();
    const cfg = ADD_METHODS[k];

      `<h3>${esc(cfg.title)}</h3>
       ${cfg.fields.map(x => `<div class="field"><label>${esc(x.label)}</label><input class="input" id="f_${x.id}" ${x.digits ? 'inputmode="numeric"' : ''} maxlength="${x.max}" placeholder="${esc(x.ph)}"></div>`).join('')}
       <div class="field"><label>Amount ($) · max ${fmt(Bank.MAX_TOPUP)}</label><input class="input" id="f_amt" inputmode="decimal" placeholder="0.00"></div>
       <div class="modal-actions"><button class="btn" data-cancel>Cancel</button><button class="btn btn-primary" id="fGo">Add money</button></div>`,
      (m, done) => {
        cfg.fields.filter(x => x.digits).forEach(x => digitsOnly($('#f_' + x.id, m)));
        const amt = $('#f_amt', m); amt.addEventListener('input', () => { amt.value = amt.value.replace(/[^\d.]/g, ''); });
        $('#fGo', m).onclick = () => {
          const vals = {};
          for (const x of cfg.fields) {
            const v = $('#f_' + x.id, m).value.trim(); vals[x.id] = v;
            if (x.digits ? v.length !== x.max : v.length < 2) return toast(x.err, 'err');
          }
          const cents = Bank.toKobo(amt.value);
          if (!(cents >= 100)) return toast('Enter an amount of at least $1.00', 'err');
          vals.cents = cents; done(vals);
        };
      });
    if (!f) return;
    const r = await Bank.fund(me.id, f.cents, cfg.body(f));
    if (!r.ok) return toast(r.msg, 'err');
    await refresh(); show(route); receipt(r.tx);
  },
  async reveal(el) {

      <div class="stat"><span>Expiry</span><b>${esc(r.expiry)}</b></div><div class="stat"><span>CVV</span><b>${esc(r.cvv)}</b></div>
      
      <div class="modal-actions"><button class="btn btn-primary" data-act="closeModal">Close</button></div>`);
  },

  async cancelCard(el) {

    const r = await Bank.cancelCard(me.id, el.dataset.id); if (!r.ok) return toast(r.msg, 'err');
    await refresh(); toast('Card cancelled'); show('cards');
  },
  async advance(el) { const r = await Bank.advanceCard(me.id, el.dataset.id); if (!r.ok) return toast(r.msg, 'err'); await refresh(); show('cards'); },
  async activate(el) {
    const pin = await askPin('Enter PIN to activate card'); if (!pin) return;
    const r = await Bank.activateCard(me.id, el.dataset.id, pin);
    if (!r.ok) return toast(r.msg, 'err');
    await refresh(); toast('Card activated'); show('cards');
  }
};

document.addEventListener('click', e => {

  if (a && acts[a.dataset.act]) { acts[a.dataset.act](a); return; }
  const g = e.target.closest('[data-go]');
  if (g) { closeModal(); show(g.dataset.go); }
});

/* ---------- render ---------- */
const VIEWS = { home: viewHome, transfer: viewTransfer, cards: viewCards, cardreq: viewCardReq, history: viewHistory, settings: viewSettings };
function renderNav() {
  const active = route === 'cardreq' ? 'cards' : route;
  $('#sidebar').innerHTML = `<a class="logo" href="/">Vault<span>a</span></a>` +
    NAV.map(([k, ic, l]) => `<button class="side-link ${k === active ? 'active' : ''}" data-go="${k}">${ic} ${l}</button>`).join('') +
    `<div class="side-foot"><div class="muted small" style="padding:0 14px 10px">${esc(me.name)}</div><button class="side-link" data-act="logout">🚪 Log out</button></div>`;
  $('#bottomNav').innerHTML = NAV.map(([k, ic, l]) => `<button class="${k === active ? 'active' : ''}" data-go="${k}"><span>${ic}</span>${l}</button>`).join('');
}
async function show(r) {
  const seq = ++showSeq;
  route = VIEWS[r] ? r : 'home';
  if (location.hash !== '#' + route) history.replaceState(null, '', '#' + route);
  if (!me || Date.now() - lastFetch > 5000) await refresh();    // data older than 5s is re-read from the server
  if (seq !== showSeq) return;                                  // a newer navigation took over
  if (!me) {
    $('#view').innerHTML = `<div class="panel"><h3>We couldn't load your account</h3><p class="muted" style="margin:8px 0 14px">${esc(loadError || 'Please try again.')}</p>
      <button class="btn btn-primary" onclick="location.reload()">Try again</button> <a class="btn" href="login.html">Back to log in</a></div>`;
    return;
  }
  const changed = route !== lastShown; lastShown = route;
  if (route === 'cardreq' && changed) wz = null;        // a fresh order each time the page is opened
  const v = $('#view');
  v.classList.toggle('noanim', !changed);
  v.innerHTML = VIEWS[route]();
  if (wire[route]) wire[route]();
  renderNav();
  FX.tilt(v);
  if (changed) {
    window.scrollTo(0, 0);
    const bb = $('#balBig');
    if (bb && route === 'home' && !hideBal) FX.countUp(bb, me.balance, fmt);
  }
}
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (h !== route && VIEWS[h]) show(h); });
show(location.hash.slice(1) || 'home');
</script>
