<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Log in | Vaulta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="blobs"><i></i><i></i><i></i></div>
<div class="auth-wrap">
  <aside class="auth-side">
    <a class="logo" href="/">Vault<span>a</span></a>
    <div>
      <h2>Welcome back.</h2>
      <p>Log in with your email or your account number.</p>
    </div>
    <small style="color:var(--muted)">&copy; 2026 Vaulta</small>
  </aside>

  <main class="auth-main">
    <form class="card" id="loginForm" novalidate>
      <h1>Log in</h1>
      <p class="sub">Enter your details to continue.</p>
      <div id="alert" class="alert"></div>

      <div class="field">
        <label for="id">Email or account number</label>
        <input class="input" id="id" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="pw">Password</label>
        <div class="pw-wrap"><input class="input" id="pw" type="password" autocomplete="current-password" required><button type="button" onclick="togglePw(this)">SHOW</button></div>
      </div>

      <button class="btn btn-primary btn-block" type="submit">Log in</button>
      <p class="switch">New to Vaulta? <a href="signup.html">Create an account</a></p>
    </form>
  </main>
</div>

<script src="app.js"></script>
<script>
const $ = id => document.getElementById(id);

// already logged in? go straight to the dashboard
API.get('/me').then(r => { if (r.ok) location.replace('dashboard.html'); });

$('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const alertEl = $('alert'), btn = e.target.querySelector('button[type=submit]');
  const idv = $('id').value.trim(), pw = $('pw').value;
  if (!idv || !pw) return showAlert(alertEl, 'err', 'Enter your email/account number and password.');
  btn.disabled = true; btn.textContent = 'Logging in...';
  const r = await API.post('/auth/login', { identifier: idv, password: pw });
  if (!r.ok) {
    btn.disabled = false; btn.textContent = 'Log in';
    return showAlert(alertEl, 'err', r.msg);
  }
  showAlert(alertEl, 'ok', 'Welcome back! Redirecting...');
  setTimeout(() => location.href = 'dashboard.html', 400);
});
</script>
</body>
</html>
